<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Racing 3D</title>
<style>
body { margin: 0; overflow: hidden; }
#info {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
  font: bold 22px Arial;
}
</style>
</head>
<body>
<div id="info">🚴 Cycle Racing 3D | Arrow Keys to Ride</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 1000
);
camera.position.set(0, 5, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 3));

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 200),
  new THREE.MeshStandardMaterial({ color: 0x444444 })
);
road.rotation.x = -Math.PI / 2;
road.position.z = -80;
scene.add(road);

const grass = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 300),
  new THREE.MeshStandardMaterial({ color: 0x35a853 })
);
grass.rotation.x = -Math.PI / 2;
grass.position.y = -0.08;
grass.position.z = -80;
scene.add(grass);

const bike = new THREE.Group();

function box(w, h, d, color, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color })
  );
  mesh.position.set(x, y, z);
  bike.add(mesh);
}

box(0.12, 0.12, 1.5, 0xff2222, 0, 0.8, 0);
box(0.45, 0.5, 0.35, 0x1565c0, 0, 1.25, 0);
box(0.3, 0.3, 0.3, 0xffcc99, 0, 1.7, 0);

function wheel(z) {
  const w = new THREE.Mesh(
    new THREE.TorusGeometry(0.42, 0.055, 8, 24),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  w.position.set(0, 0.42, z);
  bike.add(w);
}
wheel(-0.65);
wheel(0.65);

bike.position.set(0, 0, 3);
scene.add(bike);

const keys = {};
let speed = 0.15;

onkeydown = e => keys[e.key.toLowerCase()] = true;
onkeyup = e => keys[e.key.toLowerCase()] = false;

function animate() {
  requestAnimationFrame(animate);

  if (keys.arrowleft || keys.a) bike.position.x -= 0.09;
  if (keys.arrowright || keys.d) bike.position.x += 0.09;
  bike.position.x = Math.max(-4.5, Math.min(4.5, bike.position.x));

  if (keys.arrowup || keys.w) speed = Math.min(0.45, speed + 0.003);
  else speed = Math.max(0.15, speed - 0.001);

  if (keys.arrowdown || keys.s) speed = 0.05;

  camera.position.x += (bike.position.x - camera.position.x) * 0.05;
  camera.lookAt(bike.position.x, 1, -5);

  renderer.render(scene, camera);
}
animate();

onresize = () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};
</script>
</body>
</html>
